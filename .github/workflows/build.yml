name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version string (for labels/artifact naming)
        type: string
        required: true
      docker_tags:
        description: >-
          Space-separated imagetools tag flags,
          e.g. "-t ghcr.io/lostb1t/remux:1.2.3 -t ghcr.io/lostb1t/remux:latest"
        type: string
        required: true
      cargo_version:
        description: >-
          Semver string to inject into all workspace Cargo.toml files before
          building. Leave empty to use the version already in Cargo.toml
          (e.g. after semantic-release has committed it).
        type: string
        required: false
        default: ""
      ref:
        description: Git ref to checkout (leave empty for the triggering SHA)
        type: string
        required: false
        default: ""
      desktop:
        description: >-
          Build the desktop bundles (Linux/macOS/Windows). Set to false for
          PR docker-only builds.
        type: boolean
        required: false
        default: true

env:
  REGISTRY_IMAGE: ghcr.io/lostb1t/remux

jobs:
  build-jellyfin-web:
    name: Build jellyfin-web
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Cache jellyfin-web dist
        id: cache
        uses: actions/cache@v4
        with:
          path: jellyfin-web/
          key: jellyfin-web-v10.11.11

      - name: Checkout jellyfin-web
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: jellyfin/jellyfin-web
          ref: v10.11.11

      - name: Setup Node
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm run build:production

      - name: Rename dist to jellyfin-web
        if: steps.cache.outputs.cache-hit != 'true'
        run: mv dist jellyfin-web

      - name: Upload artifact
        # Always upload: GitHub caches are scoped per runner OS, so the Windows/
        # macOS desktop jobs must get the build via artifact, not the ubuntu cache.
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-web-dist
          path: jellyfin-web/
          retention-days: 1

  build-dashboard:
    name: Build dashboard
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: dashboard

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Set workspace version
        if: inputs.cargo_version != ''
        run: |
          cargo binstall cargo-edit@0.11.11 --no-confirm --locked
          cargo set-version "${{ inputs.cargo_version }}"

      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli@0.7.3 --no-confirm --force

      - name: Build dashboard
        working-directory: crates/remux-dashboard
        run: ~/.cargo/bin/dx build --release

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: target/dx/remux-dashboard/release/web/public/
          retention-days: 2

  build-server:
    name: Build server (${{ matrix.os_name }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64
            os_name: linux
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            os_name: linux
          - runner: macos-latest
            target: x86_64-apple-darwin
            arch: amd64
            os_name: macos
          - runner: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            os_name: macos
    steps:
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: server-${{ matrix.arch }}

      - name: Set workspace version
        if: inputs.cargo_version != ''
        run: |
          cargo install cargo-edit@0.11.11 --locked
          cargo set-version "${{ inputs.cargo_version }}"

      - name: Build remux-server
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release --target ${{ matrix.target }} -p remux-server

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.os_name }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/remux-server
          retention-days: 1

  build-desktop:
    if: inputs.desktop
    name: Build desktop (${{ matrix.target }})
    needs: [build-dashboard, build-jellyfin-web]
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: remux-desktop-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: remux-desktop-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: remux-desktop-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: remux-desktop-windows-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Free disk space (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/ || true
          sudo rm -rf /Library/Developer/CoreSimulator || true
          sudo rm -rf ~/Library/Developer/CoreSimulator || true
          sudo rm -rf ~/Library/Developer/Xcode/iOS\ DeviceSupport/ || true
          sudo rm -rf /Applications/Xcode_*.app || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/local/share/dotnet || true
          sudo rm -rf /Library/Java/JavaVirtualMachines/ || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf "$HOME/.cache" || true
          # GH Actions installs Python/Ruby/Node runtimes here (~10-15 GB on macOS)
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Set workspace version
        if: inputs.cargo_version != ''
        run: |
          cargo binstall cargo-edit@0.11.11 --no-confirm --locked
          cargo set-version "${{ inputs.cargo_version }}"

      - name: Install cargo-bundle
        run: cargo binstall cargo-bundle --no-confirm --force

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            pkg-config \
            libxdo-dev

      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: target/dx/remux-dashboard/release/web/public/

      - name: Download jellyfin-web artifact
        # Always download (not cache restore): caches are OS-scoped.
        uses: actions/download-artifact@v4
        with:
          name: jellyfin-web-dist
          path: jellyfin-web/

      - name: Bundle remux-desktop (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          SQLX_OFFLINE: "true"
          DASHBOARD_PATH: ${{ github.workspace }}/target/dx/remux-dashboard/release/web/public
          WEB_PATH: ${{ github.workspace }}/jellyfin-web
        run: cargo bundle --release --target ${{ matrix.target }} -p remux-desktop

      - name: Build remux-desktop (Windows)
        if: runner.os == 'Windows'
        env:
          SQLX_OFFLINE: "true"
          DASHBOARD_PATH: ${{ github.workspace }}/target/dx/remux-dashboard/release/web/public
          WEB_PATH: ${{ github.workspace }}/jellyfin-web
        run: cargo build --release --target ${{ matrix.target }} -p remux-desktop

      - name: Sign and package bundle (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP=$(ls -d target/${{ matrix.target }}/release/bundle/osx/*.app | head -1)
          codesign --deep --force --sign - "$APP"
          df -h /
          # The dashboard and jellyfin-web are already embedded in the binary at
          # compile time; drop the downloaded copies so hdiutil has headroom.
          rm -rf jellyfin-web
          rm -rf target/dx/remux-dashboard/release/web/public
          # Cargo incremental artifacts are dead weight after a successful link.
          rm -rf target/${{ matrix.target }}/release/incremental
          df -h /
          hdiutil create -volname "Remux" -srcfolder "$APP" -fs HFS+ -ov -format UDZO ${{ matrix.artifact }}.dmg

      - name: Package bundle (Linux .deb)
        if: runner.os == 'Linux'
        run: cp target/${{ matrix.target }}/release/bundle/deb/*.deb ${{ matrix.artifact }}.deb

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/remux-desktop.exe" .
          Compress-Archive -Path "remux-desktop.exe" -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.dmg

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.deb

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  smoke-test-windows:
    if: inputs.desktop
    name: Smoke test (Windows)
    needs: build-desktop
    runs-on: windows-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: remux-desktop-windows-x86_64

      - name: Extract
        shell: pwsh
        run: Expand-Archive -Path remux-desktop-windows-x86_64.zip -DestinationPath .

      - name: Start and probe
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "remux-desktop.exe" -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            $up = $false
            do {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest -Uri "http://localhost:3000/health" -UseBasicParsing -ErrorAction Stop
                if ($r.StatusCode -eq 200) { $up = $true; break }
              } catch {}
            } until ((Get-Date) -gt $deadline)
            if (-not $up) {
              Write-Error "remux-desktop did not respond on /health within 60s"
              exit 1
            }

            # Embedded web UI must be served (dashboard at /admin, jellyfin-web at /).
            foreach ($path in @("/admin", "/admin/", "/")) {
              try {
                $resp = Invoke-WebRequest -Uri "http://localhost:3000$path" -UseBasicParsing -ErrorAction Stop
                $html = $resp.Content -match '<!DOCTYPE|<html'
                Write-Host "=== $path -> $($resp.StatusCode) html=$html"
                if ($resp.StatusCode -ne 200 -or -not $html) {
                  Write-Error "web UI not served at $path"
                  exit 1
                }
              } catch {
                Write-Error "web UI not served at ${path}: $_"
                exit 1
              }
            }
            Write-Host "web UI + admin OK"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

  build-docker:
    name: Build Docker (${{ matrix.platform }})
    needs: [build-dashboard, build-server, build-jellyfin-web]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/

      - name: Download jellyfin-web artifact
        # Always download (not cache restore): caches are OS-scoped.
        uses: actions/download-artifact@v4
        with:
          name: jellyfin-web-dist
          path: jellyfin-web/

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: server-linux-${{ matrix.arch }}
          path: ./

      - name: Mark binaries executable
        run: chmod +x ./remux-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: lostb1t
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-docker:
    name: Merge Docker manifests
    needs: [build-docker, build-desktop, smoke-test-windows]
    if: |
      always() &&
      needs.build-docker.result == 'success' &&
      (needs.build-desktop.result == 'success' || needs.build-desktop.result == 'skipped') &&
      (needs.smoke-test-windows.result == 'success' || needs.smoke-test-windows.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: lostb1t
          password: ${{ secrets.GH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create ${{ inputs.docker_tags }} \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

