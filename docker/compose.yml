services:
  remux-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
