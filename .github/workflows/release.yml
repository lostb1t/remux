name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/lostb1t/remux

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  preview:
    name: Preview release version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release (dry run)
        id: release
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
          extra_plugins: |
            semantic-release-cargo
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: "not-publishing-to-crates-io"

  build:
    name: Build
    needs: preview
    if: needs.preview.outputs.new_release_published == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.preview.outputs.new_release_version }}
      cargo_version: ${{ needs.preview.outputs.new_release_version }}
      docker_tags: >-
        -t ghcr.io/lostb1t/remux:${{ needs.preview.outputs.new_release_version }}
        -t ghcr.io/lostb1t/remux:latest
    secrets: inherit

  semantic-release:
    name: Semantic Release
    needs: [preview, build]
    if: needs.preview.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    outputs:
      new_release_version: ${{ steps.release.outputs.new_release_version }}
      new_release_git_tag: ${{ steps.release.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Semantic Release
        id: release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            semantic-release-cargo
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          CARGO_REGISTRY_TOKEN: "not-publishing-to-crates-io"

  publish-release:
    name: Publish release
    needs: [preview, semantic-release]
    if: needs.preview.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download server binary (linux-amd64)
        uses: actions/download-artifact@v4
        with:
          name: server-linux-amd64
          path: artifacts/linux-amd64/

      - name: Download server binary (linux-arm64)
        uses: actions/download-artifact@v4
        with:
          name: server-linux-arm64
          path: artifacts/linux-arm64/

      - name: Download server binary (macos-amd64)
        uses: actions/download-artifact@v4
        with:
          name: server-macos-amd64
          path: artifacts/macos-amd64/

      - name: Download server binary (macos-arm64)
        uses: actions/download-artifact@v4
        with:
          name: server-macos-arm64
          path: artifacts/macos-arm64/

      - name: Download dashboard
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: artifacts/dashboard/

      - name: Download jellyfin-web
        uses: actions/download-artifact@v4
        with:
          name: jellyfin-web-dist
          path: artifacts/jellyfin-web/

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: remux-desktop-*
          merge-multiple: true

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_git_tag }}
          path: source

      - name: Prepare release assets
        run: |
          VERSION="${{ needs.preview.outputs.new_release_version }}"
          cp artifacts/linux-amd64/remux-server "remux-${VERSION}-linux-amd64"
          cp artifacts/linux-arm64/remux-server "remux-${VERSION}-linux-arm64"
          cp artifacts/macos-amd64/remux-server "remux-${VERSION}-macos-amd64"
          cp artifacts/macos-arm64/remux-server "remux-${VERSION}-macos-arm64"
          chmod +x "remux-${VERSION}-linux-amd64" "remux-${VERSION}-linux-arm64" \
                   "remux-${VERSION}-macos-amd64" "remux-${VERSION}-macos-arm64"
          tar -czf "remux-${VERSION}-dashboard.tar.gz" -C artifacts/dashboard .
          tar -czf "remux-${VERSION}-jellyfin-web.tar.gz" -C artifacts/jellyfin-web .

      - name: Extract changelog for this release
        run: |
          VERSION="${{ needs.preview.outputs.new_release_version }}"
          awk "/^#+ \[?${VERSION}\]?/{found=1; next} found && /^#+ \[/{exit} found{print}" \
            source/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${VERSION}" > release-notes.md
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.preview.outputs.new_release_version }}"
          TAG="${{ needs.semantic-release.outputs.new_release_git_tag }}"
          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "${TAG}" \
            --notes-file release-notes.md \
            "remux-${VERSION}-linux-amd64" \
            "remux-${VERSION}-linux-arm64" \
            "remux-${VERSION}-macos-amd64" \
            "remux-${VERSION}-macos-arm64" \
            "remux-${VERSION}-dashboard.tar.gz" \
            "remux-${VERSION}-jellyfin-web.tar.gz" \
            "remux-desktop-linux-x86_64.deb" \
            "remux-desktop-macos-aarch64.dmg" \
            "remux-desktop-macos-x86_64.dmg" \
            "remux-desktop-windows-x86_64.zip"
